name: E2E Tests (Manual)

# E2E tests never run automatically — no push, PR or schedule trigger.
# Run them from the Actions tab, or: gh workflow run e2e.yml -f suite=store
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which Playwright suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - store
          - ui
          - shell

# Read-only job token (CodeQL actions/missing-workflow-permissions): the run only reads the repo
# and uploads an artifact.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite (${{ inputs.suite }})
        run: |
          case "${{ inputs.suite }}" in
            store) pnpm run test:e2e:store ;;
            ui)    pnpm run test:e2e:ui ;;
            shell) pnpm exec playwright test --project shell ;;
            *)     pnpm run test:e2e ;;
          esac

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ inputs.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
