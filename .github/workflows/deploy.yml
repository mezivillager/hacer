name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: read # Mission Control's collector reads issues and pull requests (#473)
  pull-requests: read

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          BASE_PATH: /hacer/

      - name: Add GitHub Pages files
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          # control/ is Mission Control's, deployed below (#473): the app's deploy leaves it alone.
          clean-exclude: |
            pr-preview
            control

      # Mission Control (#473), after the app, so a collector failure never holds the app back. The collector reads
      # the layer ratchet's history from git log, so a shallow checkout is deepened first.
      - name: Build Mission Control
        run: |
          [ "$(git rev-parse --is-shallow-repository)" = false ] || git fetch --unshallow --quiet
          pnpm run build:control
        env:
          BASE_PATH: /hacer/
          GH_TOKEN: ${{ github.token }}

      - name: Deploy Mission Control
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: mission-control/dist
          target-folder: control
          # Protects control/history/ (#476) from this step's own clean (rsync --delete, scoped to
          # target-folder): every push to main runs this step, and without the exclusion it would empty the
          # hourly workflow's archive on the next app deploy.
          clean-exclude: |
            history
