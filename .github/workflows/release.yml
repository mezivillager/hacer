name: Release

on:
  push:
    branches:
      - main
      - beta
      - alpha
  workflow_dispatch:

# Read-only at workflow level. The job below states its own block, which replaces this one.
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'push' || !github.event.head_commit || !contains(github.event.head_commit.message, '[skip ci]')
    # No `id-token`: nothing is published to npm (.releaserc.json sets `npmPublish: false` and the
    # package is private), so no OIDC token is ever requested.
    permissions:
      contents: write # semantic-release pushes the release tag and creates the GitHub Release
      issues: write # @semantic-release/github comments on released issues, labels them, and opens one if a release fails
      pull-requests: write # @semantic-release/github comments on and labels the released pull requests

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify build and tests
        run: |
          pnpm run lint
          pnpm run test:run
          pnpm run build

      - name: Configure git for the release tag push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The job's own short-lived GITHUB_TOKEN is enough since ADR-0015: a release only pushes a
      # tag (tags are outside the main-rules ruleset) and creates a GitHub Release. No long-lived
      # personal token is kept in repo secrets (#162).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
