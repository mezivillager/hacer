name: browser-qa

# Browser QA in the cloud for critical changes (ADR-0016, amends ADR-0012). Runs on every PR
# and always reports: when the PR touches no critical path — src/components, src/gates,
# src/nodes, src/App.tsx, src/store/actions (a rename counts by its old path too) — and neither
# it nor an issue its body links (Fixes/Closes/Resolves/Part of #n) carries `critical`,
# `sev:high` or `sev:critical`, it exits green with `BROWSER-QA: skipped (no critical paths)`
# (the body decides too, hence `edited`). Otherwise it builds the bundle, serves it with
# `vite preview` (playwright.config.ts webServer, CI branch) and runs the Playwright `@store`
# suite — plus `@ui` when src/components/canvas, src/gates or src/nodes are touched — then
# prints one greppable `BROWSER-QA: PASS|FAIL suites=… passed=… failed=…` line. Browser suites
# never run on a laptop as a gate; `e2e.yml` stays for manual runs.
#
# Decision and verdict: scripts/browser-qa.mjs (rules in browser-qa.logic.mjs, unit tested).
# Re-check a PR by hand: gh workflow run browser-qa.yml -f pr=<n> — it tests the PR's merge ref,
# like the PR's own run, but reports in its log and job summary, not as the PR's check.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: read # the labels of the issues a PR body links

# Per event, so a manual re-check never cancels the PR's own in-flight check.
concurrency:
  group: browser-qa-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: browser-qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}

    steps:
      # Both events test the PR merged into main: pull_request by default, workflow_dispatch by
      # number. The merge ref also carries main's scripts/browser-qa.mjs to a PR branched earlier.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || '' }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Node built-ins only — runs before the install so a non-critical PR is green in seconds.
      - name: Critical paths → suites
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull.json"
          node scripts/browser-qa.mjs decide "$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/pull.json" "$RUNNER_TEMP/decision.json"

      - uses: pnpm/action-setup@v6
        if: steps.decide.outputs.critical == 'true'

      - run: pnpm install --frozen-lockfile
        if: steps.decide.outputs.critical == 'true'

      - name: Install Playwright browsers
        if: steps.decide.outputs.critical == 'true'
        run: pnpm exec playwright install --with-deps chromium

      # `CI` makes playwright.config.ts build the bundle and serve it with `vite preview`; the
      # SwiftShader WebGL flags come from the same config. One run covers every selected suite.
      - name: Playwright against the built bundle
        if: steps.decide.outputs.critical == 'true'
        env:
          GREP: ${{ steps.decide.outputs.grep }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/browser-qa.json
        run: pnpm exec playwright test --grep "$GREP" --workers 1 --retries 2 --reporter=html,json

      - name: Upload playwright-report
        if: always() && steps.decide.outputs.critical == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-pr-${{ env.PR_NUMBER }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Verdict
        if: always() && steps.decide.outputs.critical == 'true'
        run: node scripts/browser-qa.mjs report test-results/browser-qa.json "$RUNNER_TEMP/decision.json"
