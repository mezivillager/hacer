name: CI

# Runs on every push to main AND on every pull request targeting main.
# All steps must pass before a PR can be merged (enforced via branch protection).
# See AGENTS.md § 4 "Quality gates" and docs/harness/README.md for a full explanation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only job token (CodeQL actions/missing-workflow-permissions): CI only reads the repo.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - run: pnpm install --frozen-lockfile

      # Peer checking runs only while pnpm resolves. --frozen-lockfile skips that, so a
      # React / R3F mismatch installs clean (R403, R404). This reads the installed tree.
      - name: Peer ranges (React, R3F, three)
        run: node scripts/peer-range.mjs

      # Catches: TypeScript type errors + ESLint violations. Its `LAYER-RATCHET:` line is also a
      # `::notice` on this check run, which Mission Control reads without log access (#477).
      - name: Lint (TypeScript + ESLint)
        run: pnpm run lint

      # Catches: machine-specific absolute paths in documentation.
      - name: Docs (no absolute paths)
        run: pnpm run lint:docs

      # Catches: failing Vitest unit and component tests.
      - name: Unit tests (Vitest)
        run: pnpm run test:run

      # Catches: compilation errors, broken imports, bad type exports.
      - name: Build (tsc + Vite)
        run: pnpm run build
