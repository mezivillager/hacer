name: PR Hygiene

# Linked issue + size budget (ADR-0013): warn above 200 reviewable changed lines, fail above
# 400 unless the PR carries the `size-override` label; fail when the body links no issue
# (exempt: docs-only PRs, a `*[bot]` author such as dependabot, the `dependencies` label). It also
# fails a closing keyword on an issue the body says is done only in part (`Part of` the same issue,
# or in part / partial / partly / remaining on the keyword's line, outside code and HTML comments),
# docs-only PRs included, because GitHub closes on the keyword alone (#485).
# Reviewable excludes tests, the lockfile, snapshots, vendored vectors, fixtures and
# linguist-generated files.
#
# Also guards the layer ratchet (#406): when a PR touches .dependency-cruiser-known-violations.json
# or .dependency-cruiser.cjs, the baseline's contents are read through the API at the merge base and
# at the PR head — and the config's text too, when the PR edits it. A row that arrives under a rule
# name the PR does not newly declare in that config fails the check, whatever the row count did, so
# fixing one violation while absorbing another is not a pass (#432). So does a rule name the merge
# base's config declares and the PR's does not, rows or none (ratchet=disarmed, #489): a rename
# gets past it only with all its rows moved to the new name, and still warns as swapped.
# What it cannot see (the residual, stated alike in .dependency-cruiser.cjs, docs/harness/README.md
# and compareRatchetBaseline): a rule declared in that config in the same PR — renamed, copied, or
# widened to cover the edge — reads armed or swapped; the fence is that the declaration is an added
# line in a reviewed file. A rule name in a comment or a string literal there counts too (the config
# is scanned as text, never run), and that is no false pass: dependency-cruiser matches
# knownViolations by rule name, so a row under a name no real rule emits suppresses nothing. It
# leans on the scan finding every rule the base config declares: a config with text but no rule
# names found fails closed (#438), and so does a missed rule that has baseline rows (#456). A rule
# with no rows that keeps its name while it stops checking — commented out, set to ignore,
# narrowed — or that is added in a form the scan cannot read is fenced by review alone (#505);
# lint:layers fails the first two once the rule has rows.
#
# Runs on pull_request_target so the checkout — and therefore scripts/pr-hygiene.mjs — is
# always the base branch's copy. The PR itself is read through the GitHub API and is never
# checked out or executed, so a PR cannot edit its own guard — reading a baseline's bytes as
# data is not running it. Keep it that way: no `ref:` on the checkout, no `pnpm install`, no
# third-party actions. `contents: read` below is what the baseline reads need.
#
# That also means this workflow only runs once it is on main — GitHub registers workflows
# from the default branch, so it cannot check the PR that introduces it. Once it is there, a
# change to it can be tried from its branch, and any PR re-checked by hand:
#   gh workflow run pr-hygiene.yml --ref <branch> -f pr=<n>
# That run uses the branch's copy and posts on the branch head, so it is named `pr-hygiene (manual)`:
# only a `pull_request_target` run posts the required `pr-hygiene` (#368).
#
# The `HYGIENE:` line is published for Mission Control (#477) by the same step: printed as a
# `::notice`, which the runner stores as an annotation on this job's check run. That is stdout, so it
# needs no permission and no step (docs/harness/mission-control.md § Checks).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

# No concurrency group, on purpose (#530). A PR opened with labels starts a run per action
# (`opened`, `labeled`, `labeled`) within seconds, and a group they share cancels some of them.
# A run it cancels in progress posts a `cancelled` check run (#295); one it drops while pending
# leaves an empty `cancelled` check suite, which the merge box reads when it is the newest.
# Either strands a green PR. So every run finishes, in seconds. Guarded by
# scripts/required-checks.logic.mjs.

jobs:
  pr-hygiene:
    name: ${{ github.event_name == 'workflow_dispatch' && 'pr-hygiene (manual)' || 'pr-hygiene' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Base branch only (the pull_request_target default) — never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Node built-ins only; no dependencies to install.
      - name: Linked issue + size budget
        run: node scripts/pr-hygiene.mjs "$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
