name: Lineage verify

# Weekly re-check of docs/decisions/premises.md, and by hand. Expiry files an issue; the job stays green.

on:
  schedule:
    # Mondays 06:17 UTC — weekly. The day-of-week field is what makes it weekly.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# One group for all runs, so a dispatch queues behind the cron run instead of filing beside it.
# No required context is posted here, so #530's rule against shared groups does not apply.
concurrency:
  group: lineage-verify
  cancel-in-progress: false

# Read-only at workflow level. The job below states its own block, which replaces this one.
permissions:
  contents: read

jobs:
  verify:
    name: lineage-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # `--file` opens or edits one issue per expired premise
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: pnpm install --frozen-lockfile

      - name: Verify premises and file expiry
        run: node scripts/lineage.mjs verify --file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
