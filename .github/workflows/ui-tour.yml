name: ui-tour

# The product role's eyes (#269, docs/harness/product-brief.md): Playwright walks the app's main
# screens and flows (e2e/tour/app-tour.spec.ts, tag @tour) against the built bundle and saves a
# full-page screenshot and an accessibility snapshot per step into tour-output/.
# Manual and cloud only (ADR-0016) — the tour mounts the 3D canvas, so it never runs on a laptop:
#   gh workflow run ui-tour.yml [--ref <branch>]   then   gh run download <run-id> -n ui-tour
# `--grep @store` / `--grep @ui` never select it (browser-qa.yml, e2e.yml's store and ui suites);
# e2e.yml's manual `all` suite does run it, in the cloud, without uploading tour-output/.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # `CI` makes playwright.config.ts build the bundle and serve it with `vite preview`; the
      # SwiftShader WebGL flags come from the same config. A retry restarts the tour from scratch.
      - name: UI tour against the built bundle
        run: pnpm exec playwright test --grep @tour --workers 1 --reporter=list,html

      - name: Upload tour-output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-tour
          path: tour-output/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload playwright-report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-tour-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
