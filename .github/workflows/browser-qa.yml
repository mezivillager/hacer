name: browser-qa

# Browser QA in the cloud for critical changes (ADR-0016, amends ADR-0012). Runs on every PR
# and always reports: when the PR changes no UI path — CRITICAL_PATHS in
# scripts/browser-qa.logic.mjs (a rename counts by its old path too) — and neither
# it nor an issue its body links (Fixes/Closes/Resolves/Part of #n) carries `critical`,
# `sev:high` or `sev:critical`, it exits green with `BROWSER-QA: skipped (no critical paths)`
# (the body decides too, hence `edited`). Otherwise it builds the bundle, serves it with
# `vite preview` (playwright.config.ts webServer, CI branch) and runs the Playwright `@store`
# suite only — `@ui` (3D) never runs automatically (ADR-0016, amended 2026-09-19) — then
# prints one greppable `BROWSER-QA: PASS|FAIL suites=… passed=… failed=…` line. Browser suites
# never run on a laptop as a gate; `e2e.yml` stays for manual runs.
#
# Decision and verdict: scripts/browser-qa.mjs (rules in browser-qa.logic.mjs, unit tested). Its
# last line — the skip or the verdict — is also a `::notice` on this check run, which Mission Control
# reads without log access (#477); that is stdout and needs no permission below.
# Re-check a PR by hand: gh workflow run browser-qa.yml -f pr=<n> — it tests the PR's merge ref,
# like the PR's own run. Its check run lands on the head of the ref it was dispatched from (the PR
# head, with `--ref <branch>`), so it is named `browser-qa (manual)`: only a `pull_request` run
# posts the required `browser-qa`, which the newest check run of that name decides (#368).

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: read # the labels of the issues a PR body links

# No concurrency group, on purpose (#530). A PR opened with labels starts a run per action
# (`opened`, `labeled`, `labeled`) within seconds, and a group they share cancels some of them.
# A run it cancels in progress posts a `cancelled` check run (#295); one it drops while pending
# leaves an empty `cancelled` check suite, which the merge box reads when it is the newest.
# Either strands a green PR. So every run finishes: 13 s when it skips, ~4 min when it runs
# Playwright, and a superseded push is not cancelled — that is the price. Guarded by
# scripts/required-checks.logic.mjs.

jobs:
  browser-qa:
    name: ${{ github.event_name == 'workflow_dispatch' && 'browser-qa (manual)' || 'browser-qa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}

    steps:
      # Both events test the PR merged into main: pull_request by default, workflow_dispatch by
      # number. The merge ref also carries main's scripts/browser-qa.mjs to a PR branched earlier.
      # Only the pull_request run reports as the PR's required check (job name above).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || '' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Node built-ins only — runs before the install so a non-critical PR is green in seconds.
      - name: Critical paths → suites
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull.json"
          node scripts/browser-qa.mjs decide "$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/pull.json" "$RUNNER_TEMP/decision.json"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.decide.outputs.critical == 'true'

      - run: pnpm install --frozen-lockfile
        if: steps.decide.outputs.critical == 'true'

      - name: Install Playwright browsers
        if: steps.decide.outputs.critical == 'true'
        run: pnpm exec playwright install --with-deps chromium

      # `CI` makes playwright.config.ts build the bundle and serve it with `vite preview`; the
      # SwiftShader WebGL flags come from the same config. One run covers every selected suite.
      - name: Playwright against the built bundle
        if: steps.decide.outputs.critical == 'true'
        env:
          GREP: ${{ steps.decide.outputs.grep }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/browser-qa.json
        run: pnpm exec playwright test --grep "$GREP" --workers 1 --retries 2 --reporter=html,json

      - name: Upload playwright-report
        if: always() && steps.decide.outputs.critical == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-qa-pr-${{ env.PR_NUMBER }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Verdict
        if: always() && steps.decide.outputs.critical == 'true'
        run: node scripts/browser-qa.mjs report test-results/browser-qa.json "$RUNNER_TEMP/decision.json"
